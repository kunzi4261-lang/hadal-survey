name: Test and deploy HADAL SURVEY
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test
      - run: node tools/build.mjs
      - name: Verify the game offline in desktop and mobile Chrome
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/hadal-qa/node_modules/playwright-core
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/hadal-qa" --no-save --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
          node tools/browser-check.mjs
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist/
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: hadal-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
